name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The fast half of the test gate — same check the pre-commit hook runs:
  # emoji + reaction-key drift locks between the client and firestore.rules.
  drift-locks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node web/rules-tests/drift-check.mjs

  # The Firestore rules suite (v3 draft + deployed-v2 pin) against the
  # emulator — the gate that must be green before any rules deploy.
  rules-emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/rules-tests/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
        working-directory: web/rules-tests
      - run: npm install -g firebase-tools
      - run: npm test
        working-directory: web/rules-tests

  # The device-suite equivalent on a simulator. FirebaseIntegrationTests is
  # skipped: the CI checkout has no GoogleService-Info.plist (gitignored;
  # the app is designed to run fully local without it) and unsigned
  # simulator builds cannot touch the keychain anyway (SecItemAdd -34018,
  # recorded in ADR-053).
  ios-tests:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)['devices']
          for runtime in sorted(data, reverse=True):
              for device in data[runtime]:
                  if 'iPhone' in device['name']:
                      print(device['udid'])
                      sys.exit()
          ")
          test -n "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep iPhone | head -3
      - name: Build for testing
        run: |
          xcodebuild -project AugmentMeReality.xcodeproj \
            -scheme AugmentMeReality \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing
      - name: Run tests
        run: |
          xcodebuild -project AugmentMeReality.xcodeproj \
            -scheme AugmentMeReality \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -skip-testing:AugmentMeRealityTests/FirebaseIntegrationTests \
            test-without-building
